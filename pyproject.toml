[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mvp-framework"
version = "0.1.0"
description = "Framework for quick development of MVP as a mesh of loosely coupled microservices"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer",
    "PyYAML",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "rich",
    "pydantic",
    "httpx"
]

[project.scripts]
mvp = "mvp.framework:app"
