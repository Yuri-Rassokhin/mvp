<html><head><title>MVP Log Viewer</title>
<style>
.component-box {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 400px;
    padding: 10px;
    background: #eef;
    border: 1px solid #88f;
    resize: both;
    overflow: auto;
}
</style>
<script>
let attached = {};
function attach() {
    const sel = document.getElementById("sel");
    const id = sel.value;
    const name = sel.options[sel.selectedIndex].dataset.name;
    const port = sel.options[sel.selectedIndex].dataset.port;
    if (attached[id]) return;
    fetch("/attach", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({instance_id: id, name: name, port: port})
    }).then(() => {
        attached[id] = true;
        const div = document.createElement("div");
        div.className = "component-box";
        div.setAttribute("draggable", true);
        div.innerHTML = "<h4>" + name + "</h4><pre id='log-" + id + "'>loading...</pre>";
        document.getElementById("logs").appendChild(div);
        makeDraggable(div);
    });
}
function refresh() {
    for (const id in attached) {
        fetch("/logs/" + id)
            .then(r => r.json())
            .then(d => {
                if (d.status === "ok")
                    document.getElementById("log-" + id).textContent = d.log;
            });
    }
}
function makeDraggable(elmnt) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    elmnt.onmousedown = dragMouseDown;
    function dragMouseDown(e) {
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
    }
    function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }
    function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
    }
}
setInterval(refresh, 1000);
</script></head>
<body>
<h2>MVP Component Logs</h2>
<select id="sel">{options}</select>
<button onclick="attach()">Attach</button>
<div id="logs" style="position: relative; width: 100%; height: 100vh;"></div>
</body></html>
